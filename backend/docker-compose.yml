# Local development: MongoDB, plus the API if you want to run it in Docker too.
# Database only:   docker compose up -d mongodb      (then `npm run dev` for the API)
# Everything:      docker compose up -d --build
# Stop:            docker compose down
# Reset (deletes data, re-runs mongo-init.js):  docker compose down -v && docker compose up -d
#
# For the server (droplet) use docker-compose.prod.yml instead.

services:
  mongodb:
    image: docker.io/mongo:7.0
    container_name: workorder_mongodb
    restart: unless-stopped
    ports:
      # 127.0.0.1 = only reachable from this computer (Compass works, the internet can't)
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: WorkOrderDB
    volumes:
      - workorder_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: workorder_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      # Inside Docker, the database is reached by its service name, not localhost.
      MONGODB_URI: mongodb://mongodb:27017/WorkOrderDB
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  workorder_data:
