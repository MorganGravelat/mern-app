openapi: 3.0.3
info:
  title: IT Work Order API
  version: 0.2.0
  description: |
    REST API for the IT work order app. Log in with `POST /auth/login`, then click
    **Authorize** and paste the `accessToken` to call protected endpoints.
servers:
  - url: /api
    description: This server
  - url: http://localhost:5000/api
    description: Local development
tags:
  - name: Auth
  - name: Work orders
  - name: Users
  - name: System
paths:
  /health:
    get:
      tags: [System]
      summary: Health check (API and database)
      responses:
        '200':
          description: API and database are up
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: ok }, db: { type: string, example: up } } }
        '503': { description: Database is down }
  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account and email a verification link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created (not verified yet)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Login or email already in use, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/verify-email:
    get:
      tags: [Auth]
      summary: Verify email (the link in the email)
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/InvalidToken' }
    post:
      tags: [Auth]
      summary: Verify email (used by the web and mobile apps)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/InvalidToken' }
  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Send a new verification link
      description: Always returns 200 so the response doesn't reveal which emails have accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with login (username) or email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { login: dchen, password: Password123! }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Wrong login or password, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Email not verified yet (code EMAIL_NOT_VERIFIED), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Trade a refresh token for a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out of every session (revokes all tokens)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Email a password reset link
      description: Always returns 200 so the response doesn't reveal which emails have accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password using the emailed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, example: NewPassword123 }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/InvalidToken' }
  /auth/me:
    get:
      tags: [Auth]
      summary: The logged-in user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { type: object, properties: { user: { $ref: '#/components/schemas/User' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workorders:
    get:
      tags: [Work orders]
      summary: List work orders (newest first, at most 200)
      description: |
        Admins and dispatchers see every work order. A technician sees only the work orders
        assigned to them. `q` searches the title and order number as plain text.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Text to find in the title or order number }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/WorkOrderStatus' } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/WorkOrderPriority' } }
      responses:
        '200':
          description: Matching work orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  workOrders: { type: array, items: { $ref: '#/components/schemas/WorkOrder' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Work orders]
      summary: Create a work order (admin or dispatcher)
      description: The new work order is always `pending` and unassigned. The server sets the order number and `createdBy`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkOrderRequest' }
      responses:
        '201': { $ref: '#/components/responses/WorkOrder' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /workorders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, example: 65f000000000000000000001 } }
    get:
      tags: [Work orders]
      summary: One work order
      description: A technician gets 404 for a work order that is not assigned to them.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/WorkOrder' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Work orders]
      summary: Edit, assign, change status or update the checklist
      description: |
        **Admin or dispatcher:** any of the fields below. `assignedTo` and `status` cannot be sent together.
        Assigning a pending work order makes it `assigned`; reassigning an in-progress work order makes it
        `assigned` again for the new technician (checklist progress is kept).

        **Technician (own work orders only):** only `status` (`in_progress` or `completed`) and `checklist`
        (tick items; tasks cannot be added, removed or renamed). Any other field returns 403.

        Allowed status changes: pending -> cancelled; assigned -> in_progress or cancelled;
        in_progress -> completed or cancelled. Completing needs every checklist item done (an empty
        checklist is fine) and sets `completedAt`. Completed and cancelled work orders cannot be changed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkOrderRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkOrder' }
        '400': { description: 'Invalid input or not an available technician (codes VALIDATION_ERROR and INVALID_ASSIGNEE)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Illegal status change, unfinished checklist, or closed work order (codes INVALID_TRANSITION, CHECKLIST_INCOMPLETE and WORK_ORDER_CLOSED)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Work orders]
      summary: Delete a work order (admin or dispatcher)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/technicians:
    get:
      tags: [Users]
      summary: Available technicians for the assignment list (admin or dispatcher)
      description: >-
        Only the id, name, availability and active job count are returned.
        `activeJobCount` counts work orders currently assigned to or in progress with that
        technician (completed and cancelled jobs don't count).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: >-
            Available technicians, sorted by active job count (fewest first), then by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  technicians: { type: array, items: { $ref: '#/components/schemas/Technician' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    RegisterRequest:
      type: object
      required: [firstName, lastName, login, email, password]
      properties:
        firstName: { type: string, example: Jamie }
        lastName: { type: string, example: Rivera }
        login: { type: string, minLength: 3, example: jrivera }
        email: { type: string, format: email, example: jamie@example.com }
        password: { type: string, minLength: 8, description: 'At least 8 characters with a letter and a number', example: Password123! }
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, description: Username or email }
        password: { type: string }
    TokenRequest:
      type: object
      required: [token]
      properties: { token: { type: string } }
    EmailRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    User:
      type: object
      properties:
        _id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        login: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, dispatcher, technician] }
        skills: { type: array, items: { type: string } }
        phone: { type: string }
        isAvailable: { type: boolean }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
    Technician:
      type: object
      properties:
        _id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        isAvailable: { type: boolean }
        activeJobCount:
          type: integer
          description: Work orders currently assigned to or in progress with this technician.
    PersonName:
      type: object
      properties:
        _id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
    WorkOrderStatus: { type: string, enum: [pending, assigned, in_progress, completed, cancelled] }
    WorkOrderPriority: { type: string, enum: [low, medium, high, critical] }
    WorkOrderCategory: { type: string, enum: [network, hardware, software, security, account] }
    ChecklistItem:
      type: object
      required: [task, done]
      properties:
        task: { type: string, maxLength: 200, example: Check access point logs }
        done: { type: boolean }
    WorkOrder:
      type: object
      properties:
        _id: { type: string }
        orderNumber: { type: string, example: WO-1001 }
        title: { type: string }
        description: { type: string }
        customerName: { type: string }
        location: { type: string }
        category: { $ref: '#/components/schemas/WorkOrderCategory' }
        priority: { $ref: '#/components/schemas/WorkOrderPriority' }
        status: { $ref: '#/components/schemas/WorkOrderStatus' }
        checklist: { type: array, items: { $ref: '#/components/schemas/ChecklistItem' } }
        createdBy: { $ref: '#/components/schemas/PersonName' }
        assignedTo: { allOf: [{ $ref: '#/components/schemas/PersonName' }], nullable: true }
        dueDate: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateWorkOrderRequest:
      type: object
      required: [title, category, dueDate]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120, example: Wi-Fi keeps dropping }
        description: { type: string, maxLength: 2000 }
        customerName: { type: string, maxLength: 100 }
        location: { type: string, maxLength: 200 }
        category: { $ref: '#/components/schemas/WorkOrderCategory' }
        priority: { $ref: '#/components/schemas/WorkOrderPriority' }
        dueDate: { type: string, example: '2026-12-15', description: A date (2026-12-15) or date and time (2026-12-15T17:00:00Z) }
        checklist:
          type: array
          maxItems: 20
          items: { type: object, required: [task], properties: { task: { type: string, maxLength: 200 } } }
    UpdateWorkOrderRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Send only the fields to change. Technicians may send only `status` and `checklist`.
      properties:
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        customerName: { type: string, maxLength: 100 }
        location: { type: string, maxLength: 200 }
        category: { $ref: '#/components/schemas/WorkOrderCategory' }
        priority: { $ref: '#/components/schemas/WorkOrderPriority' }
        dueDate: { type: string, example: '2026-12-31' }
        checklist: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/ChecklistItem' } }
        status: { $ref: '#/components/schemas/WorkOrderStatus' }
        assignedTo: { type: string, description: 'Id of an available technician (staff only; not together with status)' }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string } } } }
  responses:
    Message:
      description: OK
      content:
        application/json:
          schema: { type: object, properties: { message: { type: string } } }
    Session:
      description: Logged in
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken: { type: string, description: 'Send as "Authorization: Bearer ..." (expires in 15 minutes)' }
              refreshToken: { type: string, description: 'Use with /auth/refresh (expires in 7 days)' }
              user: { $ref: '#/components/schemas/User' }
    ValidationError:
      description: Missing or invalid fields (code VALIDATION_ERROR)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InvalidToken:
      description: Token is invalid or expired (code INVALID_TOKEN)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing, invalid, or revoked token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Your role may not do this (code FORBIDDEN)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: No such work order, or it is not assigned to you (code NOT_FOUND)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    WorkOrder:
      description: The work order
      content:
        application/json:
          schema: { type: object, properties: { workOrder: { $ref: '#/components/schemas/WorkOrder' } } }
